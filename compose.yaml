services:
  fleets-db:
    image: "postgres:latest"
    container_name: "fleet-postgres"
    restart: "always"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - fleets_data:/var/lib/postgresql
    networks:
      - fleets-network

  redis:
    image: 'redis:latest'
    ports:
      - '6379:6379'
volumes:
  fleets_data:
networks:
  fleets-network: